services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: thrp
      MYSQL_USER: thrp
      MYSQL_PASSWORD: thrp
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    # Use the native authentication plugin so the `thrp` user can connect
    command: --default-authentication-plugin=mysql_native_password

  adminer:
    image: adminer
    restart: always
    ports:
      - ${ADMINER_HTTP_PORT:-12082}:8080
    depends_on:
      - mysql


volumes:
  mysql_data: